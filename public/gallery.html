<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photo Gallery — Sane Living</title>
  <meta name="description" content="Photos of the Sane Living Center in downtown Ojai, California — the soundproof auditorium, weddings, conference room, and outdoor space.">
  <link rel="stylesheet" href="/style.css">
  <style>
    .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 26px; }
    .gallery-item { margin: 0; transition: transform 0.25s ease; }
    .gallery-item img { width: 100%; height: 240px; object-fit: cover; border-radius: 14px; display: block; box-shadow: 0 10px 30px rgba(42,26,51,.12); transition: transform 0.4s ease, box-shadow 0.3s ease; }
    .gallery-item:hover { transform: translateY(-4px); }
    .gallery-item:hover img { transform: scale(1.03); box-shadow: 0 18px 44px rgba(42,26,51,.18); }
    .gallery-item figcaption { text-align: center; color: var(--clr-text-muted); font-size: 0.92rem; margin-top: 10px; }
    .gallery-filters { text-align: center; margin-bottom: var(--space-xl); }
    .gallery-filters button { margin: 0 4px; }
    .gallery-filters button.active { background: var(--clr-accent); color: #fff; border-color: var(--clr-accent); box-shadow: 0 6px 18px rgba(138,86,160,.35); }
    @media (prefers-reduced-motion: reduce) { .gallery-item, .gallery-item img { transition: none; } }
  </style>
  <meta property="og:title" content="Photo Gallery — Sane Living">
  <meta property="og:description" content="Photos of the Sane Living Center in downtown Ojai, California.">
  <meta property="og:image" content="https://saneliving.com/images/homepage-hero.jpg">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://saneliving.com/gallery/">
</head>
<body>

  <nav id="site-nav"></nav>

  <section class="page-hero">
    <div class="container">
      <span class="label">Sane Living Center</span>
      <h1>Photo Gallery</h1>
      <p>The auditorium, weddings, and outdoor space at 316 E. Matilija St, Ojai.</p>
    </div>
  </section>

  <section class="section">
    <div class="content-block">
      <div class="gallery-filters" data-animate>
        <button class="btn btn-outline active" data-filter="all">All Photos</button>
        <button class="btn btn-outline" data-filter="venue">The Venue</button>
        <button class="btn btn-outline" data-filter="weddings">Weddings</button>
        <button class="btn btn-outline" data-filter="outdoor">Outdoor</button>
      </div>
      <div class="gallery-grid" id="gallery-grid" data-animate>
        <p style="text-align:center; color: var(--clr-text-muted);">Loading photos...</p>
      </div>
      <div style="text-align:center; margin-top: var(--space-2xl);">
        <a href="/rent/pricing/" class="btn btn-primary">See Rates &amp; Availability</a>
        <a href="/rent/weddings/" class="btn btn-outline" style="margin-left: var(--space-md);">Weddings</a>
      </div>
    </div>
  </section>

  <footer id="site-footer"></footer>
  <script src="/script.js"></script>
  <script>
  (function() {
    // Photos are managed in the team dashboard (/admin) -> /content/gallery.json
    function esc(s) { return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
    var grid = document.getElementById('gallery-grid');
    var photos = [];
    function render(filter) {
      var list = photos.filter(function(p) { return filter === 'all' || (p.section || 'venue') === filter; });
      if (!list.length) { grid.innerHTML = '<p style="text-align:center; color: var(--clr-text-muted);">No photos here yet.</p>'; return; }
      grid.innerHTML = list.map(function(p) {
        return '<figure class="gallery-item"><a href="' + esc(p.image) + '" target="_blank"><img src="' + esc(p.image) + '" alt="' + esc(p.alt || p.caption) + '" loading="lazy"></a>' +
          (p.caption ? '<figcaption>' + esc(p.caption) + '</figcaption>' : '') + '</figure>';
      }).join('');
    }
    document.querySelectorAll('.gallery-filters button').forEach(function(btn) {
      btn.addEventListener('click', function() {
        document.querySelectorAll('.gallery-filters button').forEach(function(b) { b.classList.remove('active'); });
        btn.classList.add('active');
        render(btn.getAttribute('data-filter'));
      });
    });
    fetch('/content/gallery.json')
      .then(function(r) { return r.ok ? r.json() : null; })
      .then(function(d) { photos = (d && d.photos) || []; render('all'); })
      .catch(function() { grid.innerHTML = '<p style="text-align:center;">Could not load photos.</p>'; });
  })();
  </script>
</body>
</html>
