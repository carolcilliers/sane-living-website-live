<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photos — Sane Living Center</title>
  <meta name="description" content="Photos of the Sane Living Center in downtown Ojai, California — the auditorium, weddings, conference room, and outdoor space.">
  <link rel="stylesheet" href="/style.css">
  <style>
    /* ---- Gallery as a guided story: intro → ways to use the Auditorium → other spaces → invitation ---- */
    .gallery-intro { max-width: 1000px; margin: 0 auto; text-align: center; }
    .gallery-intro > p:not(.gallery-lede) { max-width: 760px; margin-left: auto; margin-right: auto; }
    #gallery-intro { padding-top: calc(var(--nav-height) + clamp(3rem, 7vw, 5rem)); }
    .gallery-intro h1 { font-size: clamp(2.6rem, 5.5vw, 4.2rem); font-weight: 600; line-height: 1.05; color: var(--clr-plum); margin-bottom: var(--space-md); }
    .gallery-intro .gallery-lede { font-variant-numeric: lining-nums; font-family: var(--font-display); font-style: italic; font-size: clamp(1.2rem, 1.9vw, 1.55rem); line-height: 1.4; color: var(--clr-plum); margin-bottom: var(--space-lg); }
    @media (min-width: 900px) { .gallery-intro .gallery-lede, .gallery-intro h1 { white-space: nowrap; } }
    .gallery-intro p { font-size: 1.05rem; line-height: 1.75; }

    .gallery-jump { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: var(--space-xl); }
    @media (min-width: 1100px) {
      /* All categories on one line: let the menu run a little wider than the text column */
      .gallery-jump { flex-wrap: nowrap; gap: 8px; width: max-content; max-width: calc(100vw - 48px); margin-left: 50%; transform: translateX(-50%); }
      .gallery-jump a { white-space: nowrap; padding: 8px 14px; }
    }
    .gallery-jump a {
      display: inline-block; padding: 8px 16px; border-radius: 999px; background: #f3ecf9; color: var(--clr-accent);
      font-size: 0.82rem; font-weight: 700; letter-spacing: 0.04em; transition: background 0.2s ease, color 0.2s ease;
    }
    .gallery-jump a:hover, .gallery-jump a:focus-visible { background: var(--clr-accent); color: #fff; }

    /* Browse by space: /gallery/?space=auditorium | conference | annex | garden */
    .space-browse { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 6px 22px; margin-top: var(--space-lg); font-size: 12px; font-weight: 800; letter-spacing: 0.16em; text-transform: uppercase; }
    .space-browse .space-browse-label { color: var(--clr-text-muted); }
    .space-browse a { color: var(--clr-plum); border-bottom: 1px solid var(--clr-border); padding-bottom: 4px; }
    .space-browse a:hover, .space-browse a:focus-visible { color: var(--clr-accent); border-color: var(--clr-accent); }
    .space-browse a[aria-current="page"] { color: var(--clr-accent); border-color: var(--clr-accent); }
    .gallery-jump { display: none !important; }
    #gallery-intro:has(.gallery-intro:not(.is-space)) { padding-bottom: clamp(1.5rem, 3vw, 2.25rem); }
    .gallery-intro:not(.is-space) .space-browse { display: none; }
    .gallery-intro.is-space .space-browse { margin-top: var(--space-xl); font-size: 13px; }
    .space-actions { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin-top: clamp(2.5rem, 5vw, 3.5rem); }

    #gallery-chapters > section { scroll-margin-top: var(--nav-height, 72px); }
    .chapter-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: var(--space-md) var(--space-xl); margin-bottom: var(--space-xl); }
    .chapter-head .chapter-text { max-width: 620px; }
    .chapter-eyebrow { display: block; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.15em; color: var(--clr-accent); margin-bottom: var(--space-sm); }
    .chapter-head h2 { margin-bottom: var(--space-sm); }
    .chapter-head p { margin: 0; }
    .chapter-cta { white-space: nowrap; }

    .mosaic { display: grid; grid-template-columns: repeat(4, 1fr); grid-auto-rows: 190px; gap: 16px; }
    .mosaic + .mosaic { margin-top: 16px; }
    .tile { position: relative; display: block; overflow: hidden; border-radius: 16px; box-shadow: 0 10px 30px rgba(42,26,51,.12); cursor: zoom-in; }
    .tile img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0.4s ease; }
    .tile:hover img, .tile:focus-visible img { transform: scale(1.04); }
    .tile:focus-visible { outline: 3px solid var(--clr-accent); outline-offset: 3px; }
    .tile .tile-caption {
      position: absolute; left: 0; right: 0; bottom: 0; padding: 28px 14px 12px; color: #fff; font-size: 0.85rem; font-weight: 600;
      background: linear-gradient(to top, rgba(35,31,32,.7), rgba(35,31,32,0)); opacity: 0; transition: opacity 0.25s ease;
    }
    .tile:hover .tile-caption, .tile:focus-visible .tile-caption { opacity: 1; }
    .t-big { grid-column: span 2; grid-row: span 2; }
    .t-wide { grid-column: span 2; }
    .t-full { grid-column: span 4; grid-row: span 2; }
    .mosaic.flip .t-big { grid-column: 3 / span 2; grid-row: 1 / span 2; }
    .mosaic.flip { grid-auto-flow: dense; }

    .gallery-closing { background: var(--clr-text); text-align: center; }
    .gallery-closing h2 { color: #fff; }
    .gallery-closing p { color: rgba(255,255,255,.8); max-width: 620px; margin: 0 auto var(--space-xl); }
    .gallery-closing .btn-outline { color: #fff; border-color: rgba(255,255,255,.7); }
    .gallery-closing .btn-outline:hover { background: #fff; color: var(--clr-text); }
    .gallery-closing .btn-row { display: flex; gap: var(--space-md); justify-content: center; flex-wrap: wrap; }

    /* Lightbox */
    .lightbox { border: 0; padding: 0; max-width: none; max-height: none; width: 100%; height: 100%; background: rgba(20,16,22,.94); color: #fff; }
    .lightbox::backdrop { background: rgba(20,16,22,.94); }
    .lightbox-inner { position: relative; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 56px 72px 24px; box-sizing: border-box; }
    .lightbox img { max-width: 100%; max-height: calc(100% - 64px); object-fit: contain; border-radius: 8px; }
    .lightbox-caption { margin-top: 14px; text-align: center; font-size: 0.95rem; color: rgba(255,255,255,.85); }
    .lightbox-count { display: block; font-size: 0.78rem; color: rgba(255,255,255,.55); margin-top: 4px; letter-spacing: .06em; }
    .lb-btn { position: absolute; background: rgba(255,255,255,.12); color: #fff; border: 0; border-radius: 999px; width: 48px; height: 48px; font-size: 1.6rem; line-height: 1; cursor: pointer; transition: background 0.2s ease; }
    .lb-btn:hover, .lb-btn:focus-visible { background: rgba(255,255,255,.28); outline: none; }
    .lb-close { top: 14px; right: 14px; }
    .lb-prev { left: 14px; top: 50%; transform: translateY(-50%); }
    .lb-next { right: 14px; top: 50%; transform: translateY(-50%); }

    @media (max-width: 768px) {
      .mosaic { grid-template-columns: repeat(2, 1fr); grid-auto-rows: 150px; gap: 10px; }
      .t-big, .mosaic.flip .t-big, .t-full { grid-column: 1 / -1; grid-row: span 2; }
      .t-wide { grid-column: span 1; }
      .chapter-cta { white-space: normal; }
      .tile .tile-caption { opacity: 1; font-size: 0.78rem; padding: 22px 10px 8px; }
      .lightbox-inner { padding: 64px 12px 24px; }
      .lb-prev, .lb-next { top: auto; bottom: 14px; transform: none; }
    }
    @media (prefers-reduced-motion: reduce) { .tile img, .tile .tile-caption, .gallery-jump a { transition: none; } }
    .space-see-all { text-align: center; margin-top: clamp(1.5rem, 3vw, 2.25rem); }
  </style>

<body>

  <nav id="site-nav"></nav>


  <section class="section" id="gallery-intro">
    <div class="container">
      <div class="gallery-intro" data-animate>
        <h1 id="gallery-title">One Space, Many Ways to Gather</h1>
        <p class="gallery-lede" id="gallery-lede">See how community comes together at 316 E. Matilija St., Ojai.</p>
        <p id="gallery-text" hidden></p>
        <nav class="gallery-jump" id="gallery-jump" aria-label="Jump to a part of the gallery"></nav>
        <nav class="space-browse" id="space-browse" aria-label="Browse photos by space"></nav>
      </div>
    </div>
  </section>

  <div id="gallery-chapters">
    <section class="section section-alt"><div class="container"><p style="text-align:center; color: var(--clr-text-muted);">Loading photos...</p></div></section>
  </div>

  <section class="section gallery-closing" id="gallery-closing">
    <div class="container" data-animate>
      <h2>Picture Your Event Here</h2>
      <p data-sentences>Tell us what you have in mind and we’ll help you find the right setup, date and rate.</p>
      <div class="btn-row">
        <a data-site-booking href="/rent/pricing/" class="btn btn-primary">See Rates &amp; Availability</a>
        <a href="/contact/" class="btn btn-outline">Contact Us</a>
      </div>
    </div>
  </section>

  <dialog class="lightbox" id="lightbox" aria-label="Photo viewer">
    <div class="lightbox-inner">
      <button type="button" class="lb-btn lb-close" id="lb-close" aria-label="Close photo viewer">&times;</button>
      <button type="button" class="lb-btn lb-prev" id="lb-prev" aria-label="Previous photo">&#8249;</button>
      <img id="lb-img" alt="">
      <div class="lightbox-caption"><span id="lb-caption"></span><span class="lightbox-count" id="lb-count"></span></div>
      <button type="button" class="lb-btn lb-next" id="lb-next" aria-label="Next photo">&#8250;</button>
    </div>
  </dialog>

  <footer id="site-footer"></footer>
  <script src="/script.js"></script>
  <script>
  (function() {
    // Photos are managed in the team dashboard (/dash/ → Photo Gallery) and saved to /content/gallery.json.
    // Each photo has a "section" (venue / weddings / outdoor). Venue photos can also have a "group",
    // which decides which Auditorium story below they appear in. Photos without a group still appear,
    // under "Around the venue", so nothing uploaded is ever hidden.
    var CHAPTERS = [
      { id: 'talks', section: 'venue', group: 'talks', eyebrow: 'Auditorium', title: 'Talks & Workshops',
        text: 'Rows of seating face the stage, with the projector, sound system and stage lighting ready for speakers, screenings and teachers.',
        cta: 'Plan a talk or workshop', href: '/rent/pricing/' },
      { id: 'wellness', section: 'venue', group: 'wellness', eyebrow: 'Auditorium', title: 'Wellness & Circles',
        text: 'Clear the chairs and the open floor becomes a calm space for meditation, breathwork, sound baths and sharing circles, lit by the stained-glass window.',
        cta: 'Host a retreat or circle', href: '/rent/pricing/' },
      { id: 'receptions', section: 'venue', group: 'receptions', eyebrow: 'Auditorium', title: 'Receptions & Screenings',
        text: 'Film nights on the big screen with full projection and sound, or round tables, cocktail tables and a long buffet for dinners, slideshows and toasts.',
        cta: 'Plan a reception or screening', href: '/rent/pricing/' },
      { id: 'performances', section: 'venue', group: 'performances', eyebrow: 'Auditorium', title: 'Concerts & Performances',
        text: 'Modular stage risers, house speakers and theater lighting make room for anything from a full band to an intimate acoustic set.',
        cta: 'Book a performance', href: '/rent/pricing/' },
      { id: 'meetings', section: 'venue', group: 'meetings', eyebrow: 'Auditorium · Conference Room · Annex Flex Space', title: 'Meetings & Classes',
        text: 'Tables can be set in a U-shape, classroom rows or small groups, with screens for presentations, in the Auditorium, the Conference Room or the Annex.',
        cta: 'Book a meeting space', href: '/rent/pricing/' },
      { id: 'weddings', section: 'weddings', eyebrow: 'Weddings', title: 'Weddings',
        text: 'Ceremonies, receptions and celebrations at Sane Living Center.',
        cta: 'Explore weddings', href: '/rent/weddings/' },
      { id: 'venue', section: 'venue', group: null, eyebrow: 'The Venue', title: 'Around the Venue', noJump: true,
        text: 'More views of the Sane Living Center and its spaces.',
        cta: 'See rates & availability', href: '/rent/pricing/' },
      { id: 'outdoor', section: 'outdoor', eyebrow: 'Outdoors', title: 'Outdoor Spaces', noJump: true,
        text: 'The stone patio by the entrance with the EVO3 sculpture, and the Secret Garden with its olive trees and string lights.',
        cta: 'Ask about outdoor space', href: '/contact/' }
    ];
    var KNOWN_GROUPS = CHAPTERS.map(function(c) { return c.group; }).filter(Boolean);

    // Browse by space: every photo tagged with a space (dashboard → Photo Gallery → "Space shown in photo"),
    // whatever kind of event it shows. Linked from the home page photo strip and the Rent the Space page.
    var SPACES = [
      { id: 'auditorium', title: 'The Auditorium', featured: ['/images/auditorium-rows-glass-doors.jpg', '/images/wedding-reception-auditorium.jpg', '/images/main-hall-01.jpg', '/images/auditorium-dance-floor-stage.jpg', '/images/main-hall-04.jpg'], lede: 'Seats 110 · 150 standing',
        text: 'A beautiful sacred space with stained glass, full sound, lighting and projection, and a portable stage on request. Set it theater-style, in a circle or with tables for screenings and dinners; shown here set for talks, circles, screenings, concerts, meetings and weddings.' },
      { id: 'conference', title: 'Conference Room', lede: 'Meetings · Presentations · Breakouts',
        text: 'A quiet, separate room with a large 9 × 5½ ft wooden table, a 56″ wall-mounted monitor, a whiteboard and natural light.' },
      { id: 'annex', title: 'The Annex', lede: 'Flex space · Classes · Bridal room',
        text: 'A bright, flexible room with white walls, part wood floor and part carpet, adjacent to the Secret Garden.', bigRight: true },
      { id: 'garden', title: 'The Secret Garden', lede: 'Outdoors · Ceremonies · Dinners',
        text: 'A hidden garden bordered by a white fence, with olive trees, a mulberry canopy and string lights overhead, just steps from the Auditorium. Outdoor sound wraps up by 10 PM.' }
    ];
    var spaceParam = new URLSearchParams(location.search).get('space');
    var activeSpace = SPACES.filter(function(s) { return s.id === spaceParam; })[0] || null;
    function browseRow() {
      var links = SPACES.map(function(s) {
        var href = activeSpace ? '#space-' + s.id : '/gallery/?space=' + s.id;
        return '<a href="' + href + '">' + esc(s.title.replace(/^The /, '')) + '</a>';
      });
      if (activeSpace) links.push('<a href="/gallery/">Browse by Event</a>');
      document.getElementById('space-browse').innerHTML = '<span class="space-browse-label">' + (activeSpace ? 'Jump To' : 'Browse by Space') + '</span>' + links.join('');
    }

    function esc(s) { return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
    function sectionOf(p) { return p.section || 'venue'; }
    function inChapter(p, c) {
      if (sectionOf(p) !== c.section) return false;
      if (c.section !== 'venue') return true;
      var g = KNOWN_GROUPS.indexOf(p.group) !== -1 ? p.group : null;
      return g === c.group;
    }

    // Lay photos out in blocks of up to five: one large photo plus smaller ones, alternating sides.
    var SHAPES = { 1: ['t-full'], 2: ['t-big', 't-big'], 3: ['t-big', 't-wide', 't-wide'], 4: ['t-big', 't-wide', '', ''], 5: ['t-big', '', '', '', ''] };
    var viewer = [];
    function tile(p, cls) {
      var i = viewer.push(p) - 1;
      return '<a class="tile ' + cls + '" href="' + esc(p.image) + '" data-lb="' + i + '">' +
        '<img src="' + esc(p.image) + '" alt="' + esc(p.alt || p.caption) + '"' + (p.caption ? ' title="' + esc(p.caption) + '"' : '') + ' loading="lazy"' + (p.focus ? ' style="object-position:' + esc(p.focus) + '"' : '') + '>' +
        (p.caption ? '<span class="tile-caption" aria-hidden="true">' + esc(p.caption) + '</span>' : '') + '</a>';
    }
    function mosaic(list, flipStart) {
      var html = '', flip = flipStart, sizes = [], left = list.length, at = 0;
      // Blocks of up to five, but never leave a single photo alone in its own row: 6 -> 3+3, 11 -> 5+3+3.
      while (left > 0) { sizes.push(Math.min(5, left)); left -= 5; }
      if (sizes.length > 1 && sizes[sizes.length - 1] === 1) { sizes.splice(-2, 2, 3, 3); }
      for (var b = 0; b < sizes.length; b++) {
        var chunk = list.slice(at, at + sizes[b]), shape = SHAPES[chunk.length];
        at += sizes[b];
        html += '<div class="mosaic' + (flip && chunk.length > 2 ? ' flip' : '') + '">' + chunk.map(function(p, k) { return tile(p, shape[k]); }).join('') + '</div>';
        flip = !flip;
      }
      return html;
    }

    function render(photos) {
      viewer = [];
      var shown = 0, jump = [];
      var html = CHAPTERS.map(function(c) {
        var list = photos.filter(function(p) { return inChapter(p, c); });
        if (!list.length) return '';
        var alt = shown % 2 === 0;
        shown++;
        if (!c.noJump) jump.push('<a href="#gallery-' + c.id + '">' + esc(c.title) + '</a>');
        return '<section class="section' + (alt ? ' section-alt' : '') + '" id="gallery-' + c.id + '" aria-labelledby="gallery-' + c.id + '-title">' +
          '<div class="container"><div class="chapter-head"><div class="chapter-text">' +
          '<span class="chapter-eyebrow">' + esc(c.eyebrow) + '</span>' +
          '<h2 id="gallery-' + c.id + '-title">' + esc(c.title) + '</h2><p>' + esc(c.text) + '</p></div>' +
          '<a class="btn btn-outline chapter-cta" href="' + esc(c.href) + '">' + esc(c.cta) + '</a></div>' +
          mosaic(list, !alt) + '</div></section>';
      }).join('');
      document.getElementById('gallery-chapters').innerHTML = html ||
        '<section class="section section-alt"><div class="container"><p style="text-align:center;">No photos here yet.</p></div></section>';
      document.getElementById('gallery-jump').innerHTML = jump.join('');
      // Links such as /gallery/#gallery-wellness (from the Rent page) point at sections created just now,
      // so scroll to them once they exist.
      var target = location.hash && document.getElementById(decodeURIComponent(location.hash.slice(1)));
      if (target) requestAnimationFrame(function() { target.scrollIntoView(); });
    }

    // Photo viewer: opens on click; the arrows move only through the photos in the same section
    // (e.g. open a Weddings photo and you only see wedding photos).
    var dlg = document.getElementById('lightbox'), lbImg = document.getElementById('lb-img'),
        lbCap = document.getElementById('lb-caption'), lbCount = document.getElementById('lb-count'), current = 0, scope = [];
    function show(pos) {
      if (!scope.length) return;
      current = (pos + scope.length) % scope.length;
      var p = viewer[scope[current]];
      lbImg.src = p.image; lbImg.alt = p.alt || p.caption || '';
      lbCap.textContent = p.caption || '';
      lbCount.textContent = (current + 1) + ' of ' + scope.length;
    }
    function openViewer(i, section) {
      // Only the photos in the clicked section, in page order.
      scope = Array.prototype.map.call((section || document).querySelectorAll('[data-lb]'), function(a) { return +a.getAttribute('data-lb'); });
      if (scope.indexOf(i) === -1) scope = [i];
      show(scope.indexOf(i));
      if (typeof dlg.showModal === 'function') { dlg.showModal(); document.body.style.overflow = 'hidden'; }
      else window.open(viewer[i].image, '_blank');
    }
    dlg.addEventListener('close', function() { document.body.style.overflow = ''; });
    document.getElementById('lb-close').addEventListener('click', function() { dlg.close(); });
    document.getElementById('lb-prev').addEventListener('click', function() { show(current - 1); });
    document.getElementById('lb-next').addEventListener('click', function() { show(current + 1); });
    dlg.addEventListener('click', function(e) { if (e.target === dlg || e.target.classList.contains('lightbox-inner')) dlg.close(); });
    dlg.addEventListener('keydown', function(e) {
      if (e.key === 'ArrowLeft') show(current - 1);
      if (e.key === 'ArrowRight') show(current + 1);
    });
    document.getElementById('gallery-chapters').addEventListener('click', function(e) {
      var more = e.target.closest('[data-see-all]');
      if (more) {
        var first = more.closest('section').querySelector('[data-lb]');
        if (first) openViewer(+first.getAttribute('data-lb'), more.closest('section'));
        return;
      }
      var a = e.target.closest('[data-lb]');
      if (!a) return;
      e.preventDefault();
      openViewer(+a.getAttribute('data-lb'), a.closest('section'));
    });

    // Spaces with many photos show five hand-picked ones; "See all" opens the viewer with every photo of that space.
    var SHOW_MAX = 5;
    function spaceGallery(s, list, flip) {
      if (list.length <= SHOW_MAX) return mosaic(list, flip);
      var picks = (s.featured || []).map(function(src) { return list.filter(function(p) { return p.image === src; })[0]; }).filter(Boolean);
      list.forEach(function(p) { if (picks.length < SHOW_MAX && picks.indexOf(p) === -1) picks.push(p); });
      var rest = list.filter(function(p) { return picks.indexOf(p) === -1; });
      return mosaic(picks, flip) +
        '<div class="space-more-tiles" hidden>' + rest.map(function(p) { return tile(p, ''); }).join('') + '</div>' +
        '<div class="space-see-all"><button type="button" class="btn btn-outline" data-see-all>See All ' + list.length + ' Photos</button></div>';
    }

    function renderSpaces(photos, target) {
      viewer = [];
      document.title = 'Browse by Space — Photos — Sane Living Center';
      document.querySelector('.gallery-intro').classList.add('is-space');
      document.getElementById('gallery-title').textContent = 'Browse by Space';
      document.getElementById('gallery-lede').textContent = 'Four spaces at 316 E Matilija St., Ojai.';
      document.getElementById('gallery-text').hidden = false;
      document.getElementById('gallery-text').textContent = 'Every photo of each space, whatever the occasion. Jump to a space below, then picture your own event there.';
      var html = SPACES.map(function(s, i) {
        var seen = {}, list = photos.filter(function(p) {
          if (p.space !== s.id || seen[p.image]) return false;
          seen[p.image] = true; return true;
        });
        var alt = i % 2 === 0;
        return '<section class="section' + (alt ? ' section-alt' : '') + '" id="space-' + s.id + '" aria-labelledby="space-' + s.id + '-title"><div class="container">' +
          '<div class="chapter-head"><div class="chapter-text"><span class="chapter-eyebrow">' + esc(s.lede) + '</span>' +
          '<h2 id="space-' + s.id + '-title">' + esc(s.title) + '</h2><p>' + esc(s.text) + '</p></div>' +
          '<a class="btn btn-outline chapter-cta" href="/rent/#space-' + s.id + '">About This Space</a></div>' +
          (list.length ? spaceGallery(s, list, s.bigRight !== undefined ? s.bigRight : !alt) : '<p style="text-align:center;">Photos of this space are coming soon.</p>') +
          '</div></section>';
      }).join('');
      document.getElementById('gallery-chapters').innerHTML = html +
        '<section class="section"><div class="container"><div class="space-actions" style="margin-top:0;"><a href="/rent/#calendar" class="btn btn-primary">Check a Date</a><a href="/gallery/" class="btn btn-outline">Browse by Event</a></div></div></section>';
      // Opened from a link to one space (e.g. the home page photo strip): scroll to that space.
      var el = target && target !== SPACES[0] && document.getElementById('space-' + target.id);
      if (location.hash) el = document.getElementById(decodeURIComponent(location.hash.slice(1))) || el;
      if (el) {
        var moved = false;
        ['wheel', 'touchstart', 'keydown', 'mousedown'].forEach(function(t) { window.addEventListener(t, function() { moved = true; }, { passive: true, once: true }); });
        var go = function() { if (!moved) el.scrollIntoView({ behavior: 'auto', block: 'start' }); };
        go(); setTimeout(go, 250);
        window.addEventListener('load', function() { go(); setTimeout(go, 400); });
      }
    }

    browseRow();
    fetch('/content/gallery.json')
      .then(function(r) { return r.ok ? r.json() : null; })
      .then(function(d) {
        var photos = ((d && d.photos) || []).filter(function(p) { return !p.draft && p.image; });
        if (activeSpace) renderSpaces(photos, activeSpace); else render(photos);
      })
      .catch(function() {
        document.getElementById('gallery-chapters').innerHTML = '<section class="section section-alt"><div class="container"><p style="text-align:center;">Could not load photos.</p></div></section>';
      });
  })();
  </script>
</body>
</html>
