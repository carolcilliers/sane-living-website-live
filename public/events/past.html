  <script>
    document.addEventListener('DOMContentLoaded', function() {
      fetch('/api/calendar-events-past')
        .then(function(r) { return r.json(); })
        .then(function(data) {
          var events = data.events || [];
          if (events.length === 0) return;

          var grid = document.querySelector('.past-events-grid');
          if (!grid) return;

          // Prepend the dynamic Airtable past events to the top of the grid
          var html = '';
          events.forEach(function(e) {
            // Only render events that have an image flier
            if (e.image && (e.image.url || e.image.thumbnail)) {
              var imgUrl = e.image.url || e.image.thumbnail;
              var thumbUrl = e.image.thumbnail || imgUrl;
              html += '<div class="past-event-card">';
              html += '<a href="' + escapeHtml(imgUrl) + '" target="_blank">';
              html += '<img src="' + escapeHtml(thumbUrl) + '" loading="lazy" alt="' + escapeHtml(e.title) + '" />';
              html += '</a></div>';
            }
          });

          // Insert dynamically fetched elements at the beginning (top-left)
          if (html) {
            grid.insertAdjacentHTML('afterbegin', html);
          }
        })
        .catch(function(err) {
          console.error('Failed to load past events from API:', err);
        });
        
      function escapeHtml(s) {
        if (!s) return '';
        return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
      }
    });
  </script>
